<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>Pacific Shield Campaign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: ops-floor console. Status bar on top, theater map left, tabbed staff panel right, turn log below. */
:root{
  --bg:#e7eae4; --panel:#f8faf6; --ink:#1b2320; --muted:#5b6660; --line:#c5ccc2; --chip:#eef1ea;
  --accent:#a95f00; --accent-ink:#fff; --accent-soft:#f3e3c9;
  --sat:#11708a; --ok:#2b7a4b; --ok-soft:#d9eee0; --bad:#b13a2e; --bad-soft:#f6dcd8; --warn:#9a7200;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --panel:#192019; --ink:#e2e8e1; --muted:#97a39b; --line:#2f3a33; --chip:#202923;
  --accent:#f0a540; --accent-ink:#1a1206; --accent-soft:#3a2a12;
  --sat:#5fd0ee; --ok:#6fcf93; --ok-soft:#173023; --bad:#f08376; --bad-soft:#3a1c18; --warn:#e3c35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --panel:#192019; --ink:#e2e8e1; --muted:#97a39b; --line:#2f3a33; --chip:#202923;
  --accent:#f0a540; --accent-ink:#1a1206; --accent-soft:#3a2a12;
  --sat:#5fd0ee; --ok:#6fcf93; --ok-soft:#173023; --bad:#f08376; --bad-soft:#3a1c18; --warn:#e3c35a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.7rem;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1}
h1 small{display:block;font-size:.7rem;letter-spacing:.18em;color:var(--muted);margin-bottom:4px}
h2{font-family:var(--f-display);font-weight:600;font-size:1.3rem;margin:0}
h3{font-family:var(--f-display);font-weight:600;font-size:1rem;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.stats b{font-size:1.05rem}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat span{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body)}
.pill{display:inline-block;font-family:var(--f-mono);font-size:.72rem;padding:1px 7px;border-radius:2px;border:1px solid var(--line);white-space:nowrap}
.pill.ok{border-color:var(--ok);color:var(--ok)}.pill.bad{border-color:var(--bad);color:var(--bad)}.pill.warn{border-color:var(--warn);color:var(--warn)}.pill.acc{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.mapbox{position:relative;width:100%;overflow:hidden;border-radius:3px;background:#2b6ea0}
.mapbox svg{display:block;width:100%;height:auto;cursor:grab}
.zoomctl{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:2}.zoomctl .btn{background:var(--panel);min-width:32px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px;border:2px solid}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
nav button{font-family:var(--f-display);font-weight:600;font-size:.98rem;letter-spacing:.04em;text-transform:uppercase;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:5px 11px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{font-family:var(--f-display);font-size:1rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:3px;padding:6px 13px;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink)}
.btn.sm{font-size:.85rem;padding:3px 9px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=number]{font:inherit;font-size:.88rem;padding:4px 6px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink);max-width:100%}
input[type=number]{width:62px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.mono{font-family:var(--f-mono);font-size:.85rem}
.fos{border:1px solid var(--line);border-radius:3px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.fos-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:center}
.tasks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.task{font-size:.72rem;line-height:1.15;padding:4px 5px;border-radius:2px;border:1px solid var(--line);background:var(--panel);min-width:0;overflow-wrap:anywhere}
.task b{font-family:var(--f-mono);font-size:.72rem;margin-right:3px}
.task.done{background:var(--ok-soft);border-color:var(--ok)}
.task.site{background:var(--accent-soft);border-color:var(--accent)}
.task.req{border-style:dashed}
.rfis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.rfi{font-size:.72rem;padding:3px 4px;border:1px solid var(--line);border-radius:2px;text-align:center;background:var(--panel);cursor:pointer;color:var(--ink);font-family:inherit}
.rfi.v1{border-color:var(--bad)}.rfi.v2{border-color:var(--warn)}.rfi.v3{border-color:var(--ok)}
.rfi b{display:block;font-family:var(--f-mono);font-size:.85rem}
.rfi.sel{outline:2px solid var(--accent)}
.rfi[aria-disabled]{cursor:default}
.task.hl{outline:2px solid var(--accent);outline-offset:1px;box-shadow:0 0 0 4px var(--accent-soft)}
.rfihelp{margin-top:6px;min-height:2.6em}
.ac{border:1px solid var(--line);border-radius:3px;padding:9px;display:flex;flex-direction:column;gap:7px;background:var(--bg)}
.ac.bad{border-color:var(--bad)}
.loadlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px}
.loadlist label{display:flex;gap:6px;align-items:flex-start;font-size:.8rem;padding:3px 5px;border:1px solid var(--line);border-radius:2px;background:var(--panel);cursor:pointer}
.meter{height:7px;background:var(--line);border-radius:2px;overflow:hidden;flex:1;min-width:80px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.over{background:var(--bad)}
.log{max-height:340px;overflow:auto;font-size:.86rem;display:flex;flex-direction:column;gap:3px}
.log p{margin:0;padding:3px 6px;border-left:3px solid var(--line)}
.log p.ok{border-left-color:var(--ok)}.log p.bad{border-left-color:var(--bad)}.log p.acc{border-left-color:var(--accent)}.log p.h{border:0;font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line)}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--panel);color:var(--ink);border-radius:5px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.choice{text-align:left;font:inherit;padding:10px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink);cursor:pointer}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.choice b{display:block;font-family:var(--f-display);font-size:1.1rem}
.help{font-size:.88rem;color:var(--muted);margin:0}
.disclaimer{font-size:.85rem;padding:8px 10px;border:1px solid var(--warn);border-left-width:4px;border-radius:2px;background:var(--panel)}
.help b{color:var(--ink)}
/* space board */
.sbwrap{overflow-x:auto}.sb{display:flex;flex-direction:column;gap:2px;min-width:560px;font-family:var(--f-mono)}
.sbrow{display:grid;gap:2px;align-items:stretch}.sbl{font-size:.66rem;color:var(--muted);align-self:center}
.sbc{font-size:.6rem;line-height:1.1;text-align:center;border:1px solid var(--line);border-radius:2px;padding:2px 0;min-height:30px;display:flex;flex-direction:column;justify-content:center;background:var(--panel);overflow:hidden}
.sbc i{font-style:normal;color:var(--muted);font-size:.55rem}.sbc.aor{background:var(--accent-soft)}
.sbc.us{border-color:var(--sat);color:var(--sat);font-weight:600}.sbc.foe{border-color:var(--bad);color:var(--bad);font-weight:600}.sbc.pr{border-color:var(--warn);color:var(--warn)}.sbc.unk{border-style:dashed;color:var(--muted)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
</style>

<div class="wrap" id="app"></div>

/* =================== HEX MATH (even-r offset, ids are row*100+col) =================== */
const hx=id=>({r:Math.floor(id/100),c:id%100});
function cube(id){const {r,c}=hx(id);const x=c-(r+(r&1))/2;return {x,z:r,y:-x-r}}
function hexDist(a,b){const A=cube(a),B=cube(b);return Math.max(Math.abs(A.x-B.x),Math.abs(A.y-B.y),Math.abs(A.z-B.z))}
function cubeToId(x,z){const r=z,c=x+(r+(r&1))/2;return r*100+c}
function hexLerp(a,b,t){const A=cube(a),B=cube(b);let x=A.x+(B.x-A.x)*t,z=A.z+(B.z-A.z)*t,y=-x-z;let rx=Math.round(x),ry=Math.round(y),rz=Math.round(z);
  const dx=Math.abs(rx-x),dy=Math.abs(ry-y),dz=Math.abs(rz-z);if(dx>dy&&dx>dz)rx=-ry-rz;else if(dy>dz)ry=-rx-rz;else rz=-rx-ry;return cubeToId(rx,rz)}
function hexXY(id){const {r,c}=hx(id);return {x:552+(c-2)*85.4-(r%2?42.7:0),y:22+r*75.5-28}}

  if(k==='shift'){const list=OP_AREAS[G.mob].conflict.slice();const i=d(list.length)-1,h=list[i];
    const opts=ZONE_HEXES[1].concat(ZONE_HEXES[2]).filter(x=>hexDist(x,h)===1&&!list.includes(x));if(opts.length){const n=pick(opts);list[i]=n;G.opShift=list;
      const mv=(G.pla[h]||[]).filter(t=>t.s!=='sj');G.pla[n]=(G.pla[n]||[]).concat(mv);G.pla[h]=(G.pla[h]||[]).filter(t=>t.s==='sj');log('bad',`Op area hex ${hexLabel(h)} moves to hex ${hexLabel(n)}. Your op areas are now ${list.map(hexLabel).join(', ')}.`)}}
  if(k==='surge'){const hs=(isTheater()?theaterAreas('conflict'):OP_AREAS[G.mob].conflict).slice().sort(()=>Math.random()-.5).slice(0,2);hs.forEach(h=>(G.pla[h]=G.pla[h]||[]).push({s:20,id:0}))}
  if(k==='allies'){G.stock.fuel+=6;G.space.cyber++;if(isTheater())Object.values(G.ai).forEach(a=>a.fos.forEach(f=>f.fuel+=3))}
}
const day=()=>Math.ceil(G.turn/turnsPerDay);

function rollAccess(first){
  Object.keys(COUNTRY_FOS).forEach(c=>{
    const pend=c==='Philippines'&&G.exord==='hesitant';
    if(!pend&&['Japan','Philippines','Thailand'].includes(c)){G.access[c]=true;return}
    const prev=G.access[c];const ok=d(10)>=(pend?3:ACCESS_ROLL[c]);G.access[c]=ok;
    if(!first&&prev!==undefined&&prev!==ok){log(ok?'ok':'bad',`State Department: ${c} ${ok?'grants':'revokes'} base access and overflight.${ok?'':' No more fighter sorties to op areas from there. Mobility aircraft keep landing rights for 2 more turns, then anything left is trapped.'}`);accessChange(c,ok,G.turn+1)}
  });
}
function accessChange(c,ok,from){G.lostAcc=G.lostAcc||{};if(ok)delete G.lostAcc[c];else G.lostAcc[c]=from}

const rollWant=()=>({'C-17':1+d(3)+(G.exord==='surge'?1:0),'C-130':1+d(3),'C-5':d(6)===6?2:1});
// TRANSCOM forecasts the next block: accurate to ±3 C-17 and C-130, ±1 C-5
function forecastTxt(w){const n=(v,k)=>Math.max(0,v+Math.round((Math.random()*2-1)*k));return `about ${n(w['C-17'],3)} C-17 (±3), ${n(w['C-130'],3)} C-130 (±3) and ${n(w['C-5'],1)} C-5 (±1)`}
function allocAircraft(first){
  const want=G.nextWant||rollWant();G.nextWant=rollWant();G.forecast=forecastTxt(G.nextWant);
  ['C-5','C-17','C-130'].forEach(t=>{
    let have=G.aircraft.filter(a=>a.type===t);
    while(have.length<want[t]){G.aircraft.push({id:G.seq++,type:t,cs:`${CS[t]} ${String(G.seq).padStart(2,'0')}`,loc:{k:'mob'},cargo:[],airborne:0,plan:null});have=G.aircraft.filter(a=>a.type===t)}
    if(!first){const idle=have.filter(a=>a.loc.k==='mob'&&!a.cargo.length);while(have.length>want[t]&&idle.length){const a=idle.pop();G.aircraft=G.aircraft.filter(x=>x!==a);have=G.aircraft.filter(x=>x.type===t)}}
  });
}

/* =================== FOS MODEL =================== */
function newFos(num){return {num,rfi:{},asked:0,site:{},got:{},done:{},timer:{},pax:0,stock:{fuel:0,bomb:0,missile:0,food:0,water:0},extras:{},fighters:0,firstArrival:null,bedPenalty:false,noFoodDays:0,runway:0,ramp:100,rampAt:null,contractQ:null,hit:0,medDP:false,taxToggle:false}}

const fosHex=f=>FOS_HEX[f.num];
function mog(f){const r=f.rfi.Ramp;const built=f.done[15]&&(f.rampAt==null||G.turn>=f.rampAt); /* Base Recovery ramp build takes 1 turn once the team is in place */
  const lvl=Math.max(r||1,built?2:0);const b=lvl===3?{u:9,f:42,l:'6 C-17 + 42 fighters'}:lvl===2?{u:3,f:7,l:'2 C-17 + 7 fighters'}:{u:1,f:2,l:'1 C-130 + 2 fighters'};
  const pct=f.ramp??100;if(pct>=100)return b;return {u:b.u*pct/100,f:Math.floor(b.f*pct/100),l:`${b.l} at ${pct}% (ramp damage)`}}
function hostCut(f,t){ // what host nation support removes from a task kit, from RFIs
  const r=f.rfi,cut={pax:0,pp:0,full:false};
  if(t===9){if(r.CFR===3){cut.pax+=5;cut.pp+=8}else if(r.CFR===2)cut.pp+=6;if(r.ATC===3)cut.pax+=8;else if(r.ATC===2)cut.pax+=5}
  if(t===10&&r.Mobility===3)cut.full=true;
  if(t===10&&r.Mobility===2)cut.pp+=3;
  if((t===1||t===2)&&r['Bed Down']===3)cut.full=true; // video walkthrough: Bed Down 3 provides Tasks 1 and 2
  if(t===1&&r['Bed Down']===2)cut.pp+=2;
  if(t===12){if(r.Fuel===3)cut.pp+=6;else if(r.Fuel===2)cut.pp+=6}
  if((t===5||t===6||t===13)&&r.Equipment===3)cut.pp+=2;

  if(t===6&&(r.Security===2||r.Security===3))cut.pax+=10;
  if((t===5||t===6)&&r.Security===3)cut.full=true; // video walkthrough: Security 3 completes Tasks 5 and 6
  if(t===14&&(r.Medical===2||r.Medical===3))cut.full=true;
  return cut;
}
function kitNeed(f,t){const T=TASKS[t],c=hostCut(f,t);if(c.full)return {pax:0,pp:0};
  let pax=Math.max(0,T.pax-c.pax);const pp=Math.max(0,T.pp-c.pp);
  if(t===6&&f.rfi.Community===1)pax+=10; if(t===5&&f.rfi.Community===2)pax+=5;
  return {pax,pp}}
function hasForklift(f){return !!f.site[10]||!!f.site[1]||f.rfi.Mobility>=2||!!f.got[10]?.eq||!!f.got[1]?.eq}
function siteCheck(f,t){const k=kitNeed(f,t),g=f.got[t]||{};if((k.pax===0||g.team)&&(k.pp===0||g.eq))f.site[t]=true}
function fighterReady(f){
  const why=[];
  const miss=FIGHTER_TASKS.filter(t=>!f.done[t]);if(miss.length)why.push('Tasks '+miss.join(', ')+' not complete');
  if(FOS_COLOR[f.num]==='red'&&!f.extras.gear)why.push('Red field needs arresting gear');
  if(isNight()&&FOS_COLOR[f.num]==='yellow'&&!f.extras.light)why.push('Day-only field at night (needs lighting)');
  if(f.runway>0)why.push('Runway damaged');
  if(!G.access[fosCountry(f.num)])why.push('No base access');
  if(isDown(f))why.push('Inoperable this turn while you survey another airfield');
  {const cj=G.space&&G.space.commJam;if(cj&&cj.t===G.turn&&cj.z===zoneOfFos(f.num)&&!covers(cj.z,'COMM'))why.push(`PLA comm jamming in GEO zone ${cj.z} (no COMM satellite coverage)`)}

}
function processTasks(f,report){
  let changed=true;
  while(changed){changed=false;
    for(const t of Object.keys(TASKS).map(Number)){
      if(f.done[t]||!f.site[t])continue;
      if(hostCut(f,t).full){f.done[t]=true;changed=true;report&&log('ok',`FOS ${f.num}: the host nation provides Task ${t} ${TASKS[t].n} in full, so it's complete.`);continue}
      if(!TASKS[t].pre.every(p=>f.done[p]))continue;
      if(t===1){const need=f.pax<=10?4:f.pax<=20?2:1; // OTS beddown timing
        f.timer[1]=(f.timer[1]||0)+1; if(f.timer[1]<need)continue}
      if(t===8){f.timer[8]=(f.timer[8]||0)+1;if(f.timer[8]<2)continue} // guide 3.6.1.2.1: 10 people take 2 turns
      f.done[t]=true;changed=true;report&&log('ok',`FOS ${f.num}: Task ${t} ${TASKS[t].n} complete.`);
      if(t===15){f.rampAt=G.turn+2;if(report&&(f.rfi.Ramp||1)<2)log('acc',`FOS ${f.num}: the Base Recovery team starts building the parking ramp. MOG rises to 2 C-17 + 7 fighters on turn ${G.turn+2}.`)}
    }
  }
}
function autoSite(f){Object.keys(TASKS).map(Number).forEach(t=>siteCheck(f,t))}

/* =================== CARGO =================== */
function itemSize(it){if(it.k==='kit'){const k=kitNeed(fosByNum(it.fos),it.t);return it.p==='team'?{pax:k.pax,pp:0}:{pax:0,pp:k.pp}}if(it.k==='extra')return {pax:EXTRAS[it.x].pax,pp:EXTRAS[it.x].pp};if(it.k==='stock')return {pax:0,pp:STOCK[it.s].pp*it.n};return {pax:0,pp:0}}
function itemLabel(it){if(it.k==='kit')return `Task ${it.t} ${it.p==='team'?'team':'equipment'} → FOS ${it.fos}`;if(it.k==='extra')return `${EXTRAS[it.x].n} → FOS ${it.fos}`;if(it.k==='stock')return `${it.n} ${STOCK[it.s].n} → FOS ${it.fos}`;return '?'}
function loadTotal(items){return items.reduce((a,it)=>{const s=itemSize(it);a.pax+=s.pax;a.pp+=s.pp;return a},{pax:0,pp:0})}
function overBy(c,tot){const pp=Math.max(0,tot.pp-c.pp),pax=Math.max(0,tot.pax-c.pax);return {pp,pax,txt:[pp?`+${pp} PP`:'',pax?`+${pax} PAX`:''].filter(Boolean).join(', ')+' over'}}
function closestCfg(type,tot){return AC[type].cfg.map(c=>({c,o:overBy(c,tot)})).sort((x,y)=>(x.o.pp+x.o.pax/6)-(y.o.pp+y.o.pax/6))[0]}
function fitCfg(type,tot){return AC[type].cfg.find(c=>tot.pp<=c.pp&&tot.pax<=c.pax)||null}

/* =================== TURN RESOLUTION =================== */
function locHex(a){return a.loc.k==='mob'?MOBS[G.mob].hex:a.loc.k==='fos'?FOS_HEX[a.loc.n]:a.loc.hex}
function locName(a){return a.loc.k==='mob'?MOBS[G.mob].n:a.loc.k==='fos'?`FOS ${a.loc.n}`:`airborne over hex ${a.loc.hex}`}
function destHex(dst){return dst==='mob'?MOBS[G.mob].hex:FOS_HEX[+dst]}
const farMob=()=>!!(MOBS[G.mob]&&MOBS[G.mob].far);
const C5_ROLL='d20 risk roll: 1-3 crash (aircraft and cargo lost), 4-6 broken 2 turns, 7-10 broken 1 turn, 11-20 no damage';
function riskNeed(a){if(!a.plan||a.plan.dest==null||a.plan.dest===''||a.broken)return 0;if(a.plan.intent==='airdrop')return 1;if(a.type!=='C-5')return 0;let n=0;const p=a.plan;if(farMob()&&a.loc.k==='mob'&&p.dest!=='mob')return 0;if(p.via)n+=2; // a C-5 lands and takes off at the en route FOS
  if(a.loc.k==='fos')n++; // takeoff from a FOS
  if(p.dest!=='mob'){const R=AC[a.type].range,dist=hexDist(locHex(a),destHex(p.dest));if(!(p.intent!=='return'&&dist>R&&(a.loc.k!=='air'||a.loc.transit)))n+=(p.intent==='return'||p.intent==='hold')?2:1}
  return n}
const GRID=[];for(let r=0;r<=9;r++)for(let c=0;c<=11;c++)GRID.push(r*100+c);
const holdHexes=(center,k)=>k<0?[]:GRID.filter(h=>hexDist(center,h)<=k);
// Where an aircraft ends the turn airborne (Kyle's ruling): after a download or airdrop it has range - distance - 1 hexes left
// and can hold over the drop hex or any hex within that; a long flight can hold anywhere within range that still reaches the destination next turn.
function holdInfo(a){const p=a.plan;if(!p||p.dest==null||p.dest===''||p.dest==='mob'||p.via)return null;const R=AC[a.type].range,from=locHex(a),to=destHex(p.dest),dist=hexDist(from,to);
  let kind,list;
  if(p.intent==='hold'){kind='hold';list=holdHexes(to,R-dist-1)}
  else if(p.intent==='airdrop'){if(p.hold==null||p.hold==='')return null;kind='airdrop';list=holdHexes(to,R-dist-1)}
  else if(p.intent!=='return'&&dist>R&&dist<=2*R&&(a.loc.k!=='air'||a.loc.transit)&&!(farMob()&&a.loc.k==='mob')){kind='enroute';list=GRID.filter(h=>h!==from&&hexDist(from,h)<=R&&hexDist(h,to)<=R)}
  else return null;
  const pick=p.hold!=null&&p.hold!==''?+p.hold:null;const sug=suggestHold(a,kind,list,from,to);
  return {kind,list,sug,hex:pick!=null?pick:sug,bad:pick!=null&&!list.includes(pick),k:R-dist-1}}
function suggestHold(a,kind,list,from,to){if(!list.length)return null;const home=MOBS[G.mob].hex;const thr=h=>phase()==='conflict'&&threatAt(h)?100:0;
  if(kind==='enroute'){const L=hexLerp(from,to,AC[a.type].range/hexDist(from,to));if(list.includes(L)&&!thr(L))return L;return list.slice().sort((x,y)=>thr(x)-thr(y)||hexDist(x,to)-hexDist(y,to))[0]}
  return list.slice().sort((x,y)=>thr(x)-thr(y)||hexDist(x,home)-hexDist(y,home)||hexDist(x,to)-hexDist(y,to))[0]}
function pathHexes(from,to){const n=hexDist(from,to),out=[];for(let i=1;i<=n;i++)out.push(hexLerp(from,to,i/n));return out}
const threatAt=h=>(G.pla[h]||[]).some(t=>t.id>=1&&t.s!=='sj');
function escortOk(h){return (UI.sorties||[]).some(s=>{if(!s.escort||s.hex!==h)return false;const f=fosByNum(s.fos);return f&&!fighterReady(f).length&&f.fighters>0&&f.stock.fuel>0&&f.stock.bomb>0&&f.stock.missile>0&&hexDist(fosHex(f),h)<=4})}
// guide 7.2.1: in conflict, airlift can't overfly a hex with known PLA forces unless a fighter escorts it into that hex this turn
function escortNeed(a){if(phase()!=='conflict'||!a.plan||a.plan.dest==null||a.plan.dest==='')return [];const HI=holdInfo(a);const pts=a.plan.via?[locHex(a),FOS_HEX[+a.plan.via],destHex(a.plan.dest)]:HI&&HI.hex!=null?(HI.kind==='enroute'?[locHex(a),HI.hex]:[locHex(a),destHex(a.plan.dest),HI.hex]):[locHex(a),destHex(a.plan.dest)];const hs=[];for(let i=1;i<pts.length;i++)hs.push(...pathHexes(pts[i-1],pts[i]));return [...new Set(hs)].filter(threatAt)}
function riskLeft(a){let used=0;for(const b of G.aircraft){if(b===a)break;used+=riskNeed(b)}return (G.riskTok||0)-used}
function planCheck(a){ // returns {ok, msgs, intent:'land'|'return'|'enroute', ...}
  const p=a.plan;if(a.broken||!p||p.dest==null||p.dest==='')return {ok:true,hold:true,msgs:[]};
  const msgs=[];const R=AC[a.type].range;const from=locHex(a),to=destHex(p.dest);const dist=hexDist(from,to);
  const items=p.load||[];const tot=loadTotal(items);const cfg=fitCfg(a.type,tot);
  if(items.length&&!cfg){const cl=closestCfg(a.type,tot);msgs.push(`Overloaded: ${tot.pp} PP + ${tot.pax} PAX doesn't fit any ${a.type} configuration. Closest is ${cl.c.n} (${cl.c.pp} PP + ${cl.c.pax} PAX), which is ${cl.o.txt}.`)}
  if(String(p.dest)===(a.loc.k==='fos'?String(a.loc.n):a.loc.k))msgs.push('Already there.');

  if(intent==='hold'){if(p.dest==='mob')msgs.push('Return partway is for a FOS download.');else if(HI&&HI.k<0)msgs.push(`Download and return partway needs ${dist} + 1 hexes before it can fly on. A ${a.type} flies ${R}.`)}
  if(HI&&HI.bad)msgs.push(`Hex ${hexLabel(+p.hold)} is out of reach for the hold. Pick a hex from the list.`);

  if(intent==='return'&&dist*2+1>R)msgs.push(`Download and return needs ${dist} + 1 + ${dist} = ${dist*2+1} hexes. A ${a.type} flies ${R}.`);
  if(intent==='airdrop'){if(a.type==='C-5')msgs.push('C-5s can\'t airdrop.');if(a.loc.k!=='mob')msgs.push('An airdrop flies from the MOB with the repair team on board.');if(!HI&&dist*2>R)msgs.push(`An airdrop and return needs ${dist} + ${dist} = ${dist*2} hexes. A ${a.type} flies ${R}.`);
    if(items.some(it=>!(it.k==='kit'&&it.t===15)))msgs.push('Only the Base Recovery (Task 15) runway repair team and equipment can be airdropped.');if(riskNeed(a)>riskLeft(a))msgs.push(`An airdrop needs a risk token. You have ${Math.max(0,riskLeft(a))} left this block.`)}
  {const L=mobRw();if(L&&(a.loc.k==='mob'||p.dest==='mob')){const M=MOBS[G.mob].n;
    if(L>=3)msgs.push(`The ${M} runway is non-operational this turn after a PLA strike. Nothing lands or takes off there.`);
    else if(L>=2&&a.type!=='C-130')msgs.push(`The ${M} runway is C-130 only this turn after a PLA strike.`);
    else if(a.type==='C-5')msgs.push(`The ${M} runway is C-17/C-130 only this turn after a PLA strike.`)}}
  if(a.loc.k==='fos'){const o=fosByNum(a.loc.n);if(o){
    if(o.runway>=3)msgs.push(`FOS ${o.num} runway is non-operational. Nothing takes off until Base Recovery repairs it.`);

    if(!canLand(fosCountry(o.num)))msgs.push(`${fosCountry(o.num)} withdrew landing rights. This aircraft is trapped at FOS ${o.num} until access returns.`);

  if(farMob()&&a.loc.k==='mob'&&p.dest!=='mob'){ // video: aircraft departing Pearl Harbor take one turn to transit to the AOR entry point
    if(intent!=='land'||p.via)msgs.push('Flights out of Hawaii spend this turn transiting to the AOR entry point. Next turn they fly on and land, so no airdrop, round trip or en route stop on this leg.');

    items.forEach(it=>{if(it.fos!==+p.dest)msgs.push(`${itemLabel(it)} is loaded on a flight to the wrong place.`)});
    return {ok:!msgs.length,msgs,intent:'transit',dist,cfg,tot}}
  const via=p.via!=null&&p.via!==''?fosByNum(+p.via):null;
  if(p.via!=null&&p.via!==''){ // video: two stops in one turn, and a download at the en route stop costs 1 hex of range
    if(!via)msgs.push('The en route stop is not one of your FOS.');
    else{const vn=via.num;
      if(a.loc.k!=='mob')msgs.push('Two-stop flights start at the MOB with both loads on board.');
      if(intent!=='land'||p.dest==='mob')msgs.push('A two-stop flight downloads at the en route stop, then lands to stay at its destination FOS.');
      if(String(vn)===String(p.dest))msgs.push('The en route stop and the destination are the same FOS.');
      const d1=hexDist(from,fosHex(via)),d2=hexDist(fosHex(via),to);if(d1+1+d2>R)msgs.push(`Two stops need ${d1} + 1 + ${d2} = ${d1+1+d2} hexes (the download at the en route stop costs 1 hex). A ${a.type} flies ${R}.`);
      if(!canLand(fosCountry(vn)))msgs.push(`${fosCountry(vn)} has denied access. No landing rights at FOS ${vn}.`);
      if(isDown(via))msgs.push(`FOS ${vn} is inoperable this turn while you survey another airfield.`);
      {const st=G.space&&G.space.storm;if(st&&st.t===G.turn&&st.z===zoneOfFos(vn)&&!covers(st.z,'WX'))msgs.push(`Typhoon over GEO zone ${st.z} and no weather satellite coverage. The stop at FOS ${vn} is cancelled this turn.`)}

      if(FOS_COLOR[vn]==='red'&&a.type==='C-5')msgs.push(`FOS ${vn} is a red field: C-17 and C-130 only.`);
      if(AC[a.type].u>mog(via).u+1e-9)msgs.push(`FOS ${vn} MOG is ${mog(via).l}. Its ramp has no room for a ${a.type}.`);
      const vit=items.filter(it=>it.fos===vn);if(vit.some(it=>itemSize(it).pp>0)&&!hasForklift(via)&&!vit.some(it=>it.k==='kit'&&it.p==='eq'&&(it.t===10||it.t===1)))msgs.push(`No forklift at FOS ${vn}. Pallets can't download at the en route stop.`)}}
  escortNeed(a).filter(h=>!escortOk(h)).forEach(h=>msgs.push(`The route crosses hex ${hexLabel(h)}, which holds known PLA forces. Plan a fighter escort into that hex on the Fighters tab first.`));
  if(intent!=='return'&&intent!=='airdrop'&&intent!=='hold'&&!via&&dist>R){

  const pref=opts.filter(h=>(G.pla[h]||[]).some(t=>t.id<2));const hex=pick(pref.length?pref:opts);
  G.ccir={hex,t:G.turn,done:false};log('acc',`CFACC intel request (CCIR): look at hex ${hexLabel(hex)} this turn for +3 MP.`)}
function executeTheaterTurn(){
  if(G.over)return;log('h',`Execution · Day ${day()} Turn ${G.turn}${isNight()?' (night)':''}`);
  if(G.role==='cspoc'){const L=G.space.lost;if(L>(G.lostSeen||0)){G.mp-=3*(L-(G.lostSeen||0));log('bad',`${L-(G.lostSeen||0)} US satellite(s) lost since last turn: −3 CSpOC points each.`);G.lostSeen=L}}
  if(G.role==='medcom'){medResolve();medComplete();medTreat()}
  if(G.role==='caoc'){resolveLines();resolveFLines()}else{autoLift();autoSorties()}
  moveFighters();
  if(G.turn%turnsPerDay===0){log('h',`End of day ${day()}`);rollAccess(false);TEAMS.forEach(m=>G.ai[m].lostC17=0);
    if(G.role==='medcom')medDayEnd()}
  if(G.turn%2===0){allocPool(); // a new apportionment every OPS block (guide 1.1.4.2)
    if(G.role==='caoc')log('acc',`CFACC pool for the next block: ${G.pool.c17} C-17s and ${G.pool.c130} C-130s. Apportion them on the Theater tab. TRANSCOM forecast for the block after: ${G.poolForecast}.`)}
  if(G.turn>=lastTurn()){endGame();save();return}
  G.turn++;
  log('h',`Day ${day()} · Turn ${G.turn} · ${phase()==='crisis'?'Crisis':'Conflict'}${isNight()?' · Night':''}`);
  if(G.turn===2*turnsPerDay+1){log('bad','FRAGORD received: lethal force is authorized. Op areas change, the MOBs may strike identified PLA targets, PRC satellites turn hostile, and FOS can be struck.');applyFragord()}
  G.space.cyberHex=null;
  randomEvent();spaceAdvance();
  if(phase()==='conflict')aiStrikes();
  if(G.role==='medcom'){aiLooks();medNewTurn()}
  else if(G.role==='caoc'){aiLooks();genLines();genFLines()}else newCCIR();
  save();
}

  2:{n:'Battlefield Surgery',pax:10,pp:3,pre:[1],fx:'Cures Red (Immediate)'},
  3:{n:'Triage Team',pax:3,pp:5,pre:[13,15],fx:'Sorts patients. No treatment without it'},
  4:{n:'Battlefield Hospital',pax:0,pp:14,pre:[],fx:'Opens the hospital: 5 Green, 5 Yellow, 5 Red beds'},
  5:{n:'Delayed Bedspace',pax:0,pp:12,pre:[15],fx:'+10 Yellow beds'},
  6:{n:'Medic Response',pax:6,pp:10,pre:[],fx:'Cures Yellow (Delayed). Brings the HH-60 for CASEVAC'},
  7:{n:'Minimal Care',pax:5,pp:4,pre:[],fx:'Cures Green (Minimal)'},
  8:{n:'Minimal Bedspace',pax:0,pp:12,pre:[15],fx:'+10 Green beds'},
  9:{n:'Flight Surgeon',pax:2,pp:5,pre:[],fx:'With 10, 11 and 12: Green patients are treated in the air'},
  10:{n:'Flight Nurse',pax:3,pp:5,pre:[],fx:'With 9, 11 and 12: Green patients are treated in the air'},
  11:{n:'Medical Service Corps',pax:4,pp:0,pre:[],fx:'Prerequisite for 12, 15 and 16'},
  12:{n:'Aeromedical Supply',pax:0,pp:4,pre:[11,15],fx:'With 9, 10 and 11: Green patients are treated in the air'},
  13:{n:'Mortuary Affairs',pax:6,pp:8,pre:[],fx:'Prerequisite for triage'},
  14:{n:'Mortuary Services',pax:2,pp:12,pre:[],fx:'+10 capacity (this game adds 10 Red beds)'},
  15:{n:'Medical Logistics',pax:4,pp:6,pre:[11],fx:'Prerequisite for 1, 3, 5, 8 and 12'},
  16:{n:'War Reserve Material',pax:4,pp:16,pre:[11],fx:'Prerequisite for 1'}};
const PAT={G:{n:'Green',l:'Minimal',days:1,cure:7,col:'#2a9d4b'},Y:{n:'Yellow',l:'Delayed',days:2,cure:6,col:'#e0a400'},R:{n:'Red',l:'Immediate',days:3,cure:2,col:'#c1121f'},B:{n:'Black',l:'Expectant',days:0,cure:0,col:'#222'}};
const WORSE={G:'Y',Y:'R',R:'B'};
const SUP={band:'Bandages',pharm:'Pharmaceuticals',iv:'IV fluid',oxy:'Oxygen',blood:'Blood',ppe:'Surgical PPE',fuel:'Fuel'};
const EVAC_SUP=['band','pharm','iv','oxy'];
const EVAC_CAP={'C-130':15,'C-17':30};
const MED_CS=['DUSTOFF','ANGEL','MERCY','REACH','EVAC','LIFELINE'];
const H=m=>G.med.hosp[m];
const hDone=(m,t)=>H(m).done.includes(+t);
const hOpen=m=>hDone(m,4);
function hBeds(m){const h=H(m);if(!hOpen(m))return {G:0,Y:0,R:0};return {G:5+(hDone(m,8)?10:0),Y:5+(hDone(m,5)?10:0),R:5+(hDone(m,14)?10:0)}}
function hUsed(m,c){return H(m).bed.filter(p=>p.c===c).length}
const canTreat=(m,c)=>hDone(m,3)&&PAT[c].cure&&hDone(m,PAT[c].cure)&&(c!=='R'||hDone(m,1));
const airTreat=m=>[9,10,11,12].every(t=>hDone(m,t));
function hNeed(m,t){const T=HOSP_TASKS[t],g=H(m).got[t]||{pax:0,pp:0};return {pax:Math.max(0,T.pax-g.pax),pp:Math.max(0,T.pp-g.pp)}}
function allFos(){return TEAMS.flatMap(m=>G.ai[m].fos.map(f=>({m,f})))}
function medFos(n){const x=allFos().find(o=>o.f.num===+n);return x&&x.f}
function rollColor(){const r=d(10);return r<=4?'G':r<=7?'Y':r<=9?'R':'B'}
function addCas(fosNum,n,why){const L=G.med.cas[fosNum]||(G.med.cas[fosNum]=[]);const tally={G:0,Y:0,R:0,B:0};
  for(let i=0;i<n;i++){const c=rollColor();tally[c]++;L.push({c,age:0})}
  log('bad',`${why}: ${n} casualties at FOS ${fosNum} (${Object.entries(tally).filter(([,v])=>v).map(([k,v])=>`${v} ${PAT[k].n}`).join(', ')}). MEDEVAC them to an open hospital.`)}
function casCount(n){return (G.med.cas[n]||[]).length}
function medInit(){
  const hosp={};TEAMS.forEach(m=>hosp[m]={done:[],got:{},bed:[],hall:[],helo:false,heloLost:false,heloGot:0});
  G.med={hosp,sup:{band:4,pharm:4,iv:4,oxy:4,blood:3,ppe:3,fuel:3},fleet:[],cas:{},downed:[],tc:[],tcDay:0,treated:0,air:0,died:0,rescued:0,captured:0,evacs:0,seq:1,cs:0};
  medFleet()}
function medFleet(){const M=G.med,old=M.fleet||[];const n17=2+(d(4)>=3?1:0),n130=2+(d(4)>=3?1:0);const list=[['C-5',1],['C-17',n17],['C-130',n130]];
  M.fleet=[];list.forEach(([type,n])=>{const keep=old.filter(a=>a.type===type&&a.busy>0).slice(0,n);keep.forEach(a=>M.fleet.push(a));for(let i=keep.length;i<n;i++){M.cs++;M.fleet.push({id:M.seq++,type,cs:`${MED_CS[M.cs%MED_CS.length]} ${10+M.cs}`,busy:0,mis:null})}});
  log('acc',`CFACC allocates MEDCOM ${n17} C-17s, ${n130} C-130s and a C-5 for this block.`)}
/* ---------- loads ---------- */
function medCfg(a){const cs=AC[a.type].cfg;return cs.find(c=>c.n===(a.mis&&a.mis.cfg))||cs[0]}
function medLoad(a){const mis=a.mis;if(!mis||mis.k!=='cargo'||!mis.to)return {pp:0,pax:0,items:[]};const c=medCfg(a);let pp=0,pax=0;const items=[];
  const others=G.med.fleet.filter(b=>b!==a&&b.mis&&b.mis.k==='cargo'&&b.mis.to===mis.to&&G.med.fleet.indexOf(b)<G.med.fleet.indexOf(a));
  const claimed={};others.forEach(b=>medLoad(b).items.forEach(it=>{const k=it.t;claimed[k]=claimed[k]||{pax:0,pp:0};claimed[k].pax+=it.pax;claimed[k].pp+=it.pp}));
  (mis.tasks||[]).forEach(t=>{let need;if(t==='helo'){need={pax:0,pp:Math.max(0,8-H(mis.to).heloGot)}}else need=hNeed(mis.to,t);const cl=claimed[t]||{pax:0,pp:0};
    const rp=Math.max(0,need.pp-cl.pp),rx=Math.max(0,need.pax-cl.pax);const gp=Math.min(rp,c.pp-pp),gx=Math.min(rx,c.pax-pax);
    if(gp>0||gx>0){pp+=gp;pax+=gx;items.push({t,pp:gp,pax:gx,full:gp>=rp&&gx>=rx})}else if(rp||rx)items.push({t,pp:0,pax:0,full:false})});
  return {pp,pax,items,cfg:c}}
function evacCheck(a){const mis=a.mis,out=[];if(!mis||mis.k!=='evac')return out;
  if(!mis.from||!mis.fos||!mis.to){out.push('Pick a base, a FOS and a hospital.');return out}
  const f=medFos(mis.fos),R=AC[a.type].range,d1=hexDist(MOBS[mis.from].hex,f.hex),d2=hexDist(f.hex,MOBS[mis.to].hex);
  if(d1>R)out.push(`${MOBS[mis.from].n} to FOS ${f.num} is ${d1} hexes, beyond ${a.type} range (${R}).`);
  if(d2>R)out.push(`FOS ${f.num} to ${MOBS[mis.to].n} is ${d2} hexes, beyond ${a.type} range (${R}).`);
  if(!hOpen(mis.to))out.push(`${MOBS[mis.to].n} hospital isn't open (Task 4).`);
  if(G.access[fosCountry(f.num)]===false)out.push(`${fosCountry(f.num)} has denied access, so FOS ${f.num} is closed.`);
  return out}
/* ---------- execution ---------- */
function medResolve(){const M=G.med;const used={band:0,pharm:0,iv:0,oxy:0};
  const loads={};M.fleet.forEach(a=>{if(!a.busy&&a.mis&&a.mis.k==='cargo'&&a.mis.to)loads[a.id]=medLoad(a)}); // plan every load before any lands
  M.fleet.forEach(a=>{if(a.busy){a.busy--;a.mis=null;return}const mis=a.mis;if(!mis)return;
    if(mis.k==='cargo'){if(!mis.to)return;const ld=loads[a.id];if(!ld.pp&&!ld.pax){log('acc',`${a.cs} (${a.type}) has nothing to carry to ${MOBS[mis.to].n} and stays at JBPHH.`);return}
      const h=H(mis.to);ld.items.forEach(it=>{if(it.t==='helo'){h.heloGot+=it.pp;if(h.heloGot>=8){h.helo=true;h.heloLost=false;h.heloGot=0;log('ok',`A replacement HH-60 reaches ${MOBS[mis.to].n}.`)}return}
        const g=h.got[it.t]||(h.got[it.t]={pax:0,pp:0});g.pax+=it.pax;g.pp+=it.pp});
      a.busy=1;log('ok',`${a.cs} (${a.type}, ${ld.cfg.n}) flies JBPHH to ${MOBS[mis.to].n}: ${ld.pp} PP + ${ld.pax} PAX for ${ld.items.filter(i=>i.pp||i.pax).map(i=>i.t==='helo'?'HH-60':`Task ${i.t}`).join(', ')}. It needs the next turn to fly back.`)}
    else if(mis.k==='evac'){const errs=evacCheck(a);if(errs.length){log('bad',`${a.cs} MEDEVAC scrubbed: ${errs[0]}`);return}
      const f=medFos(mis.fos);if(stormBlocks(f)){log('bad',`${a.cs} MEDEVAC scrubbed: typhoon over GEO zone ${zoneOfFos(f.num)}.`);return}
      if(EVAC_SUP.some(k=>M.sup[k]-used[k]<1)){log('bad',`${a.cs} MEDEVAC scrubbed: each MEDEVAC flight needs 1 bandage, pharmaceutical, IV and oxygen, and you're out.`);return}
      EVAC_SUP.forEach(k=>used[k]++);M.evacs++;
      const L=M.cas[f.num]||[];const ord={R:0,Y:1,G:2,B:3};L.sort((x,y)=>ord[x.c]-ord[y.c]);const take=L.splice(0,EVAC_CAP[a.type]);
      if(!take.length){log('acc',`${a.cs} MEDEVAC reaches FOS ${f.num} but nobody is waiting. Supplies used anyway.`);return}
      let inAir=0;const land=[];take.forEach(p=>{if(p.c==='G'&&airTreat(mis.from)){inAir++;M.treated++;M.air++;G.mp++}else land.push(p)});
      land.forEach(p=>admit(mis.to,p));
      log('ok',`${a.cs} (${a.type} MEDEVAC) lifts ${take.length} patient${take.length===1?'':'s'} from FOS ${f.num} to ${MOBS[mis.to].n}${inAir?`. ${inAir} Green treated in the air: +${inAir} MP`:''}.`)}});
  EVAC_SUP.forEach(k=>M.sup[k]-=used[k]);
  M.downed.filter(p=>p.go).forEach(p=>{const m=p.go;p.go=null;const h=H(m);
    if(!h.helo||M.sup.fuel<1){log('bad',`CASEVAC from ${MOBS[m].n} can't launch: ${!h.helo?'no HH-60 there':'no fuel'}.`);return}
    if(hexDist(MOBS[m].hex,p.hex)>3){log('bad',`CASEVAC from ${MOBS[m].n} can't reach hex ${hexLabel(p.hex)} (beyond 3 hexes).`);return}
    M.sup.fuel--;const threat=(G.pla[p.hex]||[]).some(t=>t.s!=='sj'&&t.s!=='aj');
    if(threat){const a=d(20),b=d(12);if(b>=a){h.helo=false;h.heloLost=true;log('bad',`PLA forces in hex ${hexLabel(p.hex)} engage the HH-60 (MEDCOM d20: ${a}, PRC d12: ${b}). It's lost and goes back to JBPHH. Fly 8 PP to ${MOBS[m].n} to replace it.`);return}
      log('ok',`The HH-60 survives the risk roll in hex ${hexLabel(p.hex)} (${a} vs ${b}).`)}
    M.downed.splice(M.downed.indexOf(p),1);M.rescued++;G.mp++;let extra='';if(hDone(m,3)&&hDone(m,6)){G.mp++;M.treated++;extra=' The pilot is treated at the hospital: +1 more.'}
    log('ok',`CASEVAC rescues the downed ${p.ft} pilot from hex ${hexLabel(p.hex)} to ${MOBS[m].n}: +1 MP.${extra}`)});
}
function admit(m,p){const b=hBeds(m);if(p.c!=='B'&&hUsed(m,p.c)<b[p.c])H(m).bed.push({c:p.c,left:PAT[p.c].days,age:0});else H(m).hall.push({c:p.c,age:0})}
function die(n,where){if(!n)return;G.med.died+=n;G.dp+=n;log('bad',`${n} expectant patient${n===1?'':'s'} die${n===1?'s':''} ${where}: +${n} DP.`)}
function medTreat(){const M=G.med;
  TEAMS.forEach(m=>{const h=H(m);let done=0,blk=0;
    h.bed=h.bed.filter(p=>{if(canTreat(m,p.c)){p.left--;if(p.left<=0){done++;return false}return true}
      p.age++;if(p.age>=2){p.age=0;const n=WORSE[p.c];if(n==='B'){blk++;return false}p.c=n;p.left=PAT[n].days;if(hUsed(m,n)>=hBeds(m)[n]){h.hall.push({c:n,age:0});return false}}return true});
    if(done){M.treated+=done;G.mp+=done;log('ok',`${MOBS[m].n} hospital returns ${done} patient${done===1?'':'s'} to duty: +${done} MP.`)}
    const hall=h.hall;h.hall=[];let black=0;
    hall.forEach(p=>{if(p.c==='B'){black++;return}const b=hBeds(m);if(hUsed(m,p.c)<b[p.c]){h.bed.push({c:p.c,left:PAT[p.c].days,age:0});return}
      p.age++;if(p.age>=1){const n=WORSE[p.c];if(n==='B'){black++;return}p.c=n;p.age=0}h.hall.push(p)});
    die(black+blk,`at ${MOBS[m].n}`)});
  Object.keys(M.cas).forEach(n=>{let black=0;M.cas[n]=M.cas[n].filter(p=>{if(p.c==='B'){black++;return false}p.age++;if(p.age>=2){p.age=0;p.c=WORSE[p.c]}return true});die(black,`waiting at FOS ${n}`)});
  M.downed=M.downed.filter(p=>{p.age=(p.age||0)+1;if(p.age>3){M.captured++;G.dp++;log('bad',`The ${p.ft} pilot down in hex ${hexLabel(p.hex)} is captured: +1 DP.`);return false}return true});
}
function medComplete(){let any=true;while(any){any=false;TEAMS.forEach(m=>{const h=H(m);Object.keys(HOSP_TASKS).forEach(t=>{t=+t;if(h.done.includes(t))return;const T=HOSP_TASKS[t],g=h.got[t];if(!g||g.pax<T.pax||g.pp<T.pp)return;
  if(!T.pre.every(p=>h.done.includes(p)))return;h.done.push(t);any=true;if(t===6){h.helo=true}log('ok',`${MOBS[m].n} hospital completes Task ${t} ${T.n}. ${T.fx}.`)})})}}
function medDayEnd(){const M=G.med,miss=Object.keys(SUP).filter(k=>M.sup[k]<1);Object.keys(SUP).forEach(k=>M.sup[k]=Math.max(0,M.sup[k]-1));
  if(miss.length){G.dp+=5;log('bad',`MEDCOM tax: short of ${miss.map(k=>SUP[k].toLowerCase()).join(', ')}. +5 DP.`)}else log('acc','MEDCOM pays the daily tax: 1 each of blood, PPE, bandages, IV, oxygen, fuel and pharmaceuticals.')}
const MED_EVENTS=[
  {n:'Vehicle rollover',cas:[2,4],t:'A convoy accident'},{n:'Heat casualties',cas:[3,6],t:'Heat injuries on the flight line'},
  {n:'Hard landing',cas:[2,5],t:'A C-130 hard landing'},{n:'Fuel fire',cas:[3,5],t:'A refueling fire'},
  {n:'Spoiled blood',sup:['blood',-2],t:'A refrigeration failure spoils 2 blood supplies.'},
  {n:'Host nation donation',sup:['iv',2],t:'The host nation donates 2 IV fluid supplies.'},
  {n:'Contaminated PPE',sup:['ppe',-1],t:'A PPE lot fails inspection: −1 surgical PPE.'},
  {n:'Medical surge',cas:[4,7],t:'A barracks outbreak'}];
function medEvent(){const e=pick(MED_EVENTS);
  if(e.cas){const fs=allFos().filter(o=>G.access[fosCountry(o.f.num)]!==false&&o.f.prog>0);const o=pick(fs.length?fs:allFos());addCas(o.f.num,e.cas[0]+d(e.cas[1]-e.cas[0]+1)-1,`MEDCOM event, ${e.n}. ${e.t}`)}
  else{const [k,v]=e.sup;G.med.sup[k]=Math.max(0,G.med.sup[k]+v);log(v<0?'bad':'ok',`MEDCOM event, ${e.n}. ${e.t}`)}}
function medNewTurn(){const M=G.med;
  M.tc=M.tc.filter(x=>{if(x.t<=G.turn){Object.entries(x.items).forEach(([k,v])=>M.sup[k]+=v);log('ok',`TRANSCOM delivers MEDCOM supplies: ${Object.entries(x.items).map(([k,v])=>`${v} ${SUP[k].toLowerCase()}`).join(', ')}.`);return false}return true});
  if(G.turn%2===1){if(G.exord==='sealift'&&G.turn<=5)log('bad','Sealift is delayed: no MEDCOM resupply this block.');else{EVAC_SUP.forEach(k=>M.sup[k]+=4);log('ok','Sealift brings MEDCOM 4 bandages, pharmaceuticals, IVs and oxygen for the new block.')}medFleet();}
  if(G.turn%2===1)medEvent();}
function medTC(kind){const M=G.med;if(M.tcDay===day())return;M.tcDay=day();const items=kind==='evac'?{band:4,pharm:4,iv:4,oxy:4}:{blood:3,ppe:3,fuel:3};M.tc.push({t:G.turn+2,items});
  log('acc',`TRANSCOM request sent: ${Object.entries(items).map(([k,v])=>`${v} ${SUP[k].toLowerCase()}`).join(', ')}. Arrives turn ${G.turn+2}.`)}
/* ---------- UI ---------- */
function bedRow(m){const b=hBeds(m),h=H(m);return ['G','Y','R'].map(c=>`<span class="pill" style="border-color:${PAT[c].col}"><b style="color:${PAT[c].col}">●</b> ${hUsed(m,c)}/${b[c]}</span>`).join(' ')+(h.hall.length?` <span class="pill bad">${h.hall.length} without a bed</span>`:'')}
function hospPanel(){
  let h=`<div class="stack"><p class="help">Stand up four hospitals at Kadena, Andersen, Yokota and Osan. A task completes when all of its people and pallets have landed and its prerequisites are done. Task 4 opens the hospital. Patients are only treated with <b>Triage (3)</b> plus the cure task for their color: Green needs 7, Yellow needs 6, Red needs 2 (and 2 needs Blood, Task 1). Treatment takes 1, 2 or 3 turns. Untreated patients get worse every 2 turns, Black patients die after 1 turn, and each death is +1 DP.</p>`;
  TEAMS.forEach(m=>{const H0=H(m);const n=H0.done.length;

    <div class="row small">${bedRow(m)} <span class="muted">treats:</span> ${['G','Y','R'].filter(c=>canTreat(m,c)).map(c=>`<b style="color:${PAT[c].col}">${PAT[c].n}</b>`).join(', ')||'<span class="muted">nothing yet</span>'}</div>

  return h+'</div>';
}

      if(mis.to){const open=Object.keys(HOSP_TASKS).filter(t=>!hDone(mis.to,t)&&(hNeed(mis.to,t).pax||hNeed(mis.to,t).pp));if(H(mis.to).heloLost)open.push('helo');
        h+=`<div class="loadlist small">${open.map(t=>{const nd=t==='helo'?{pax:0,pp:8-H(mis.to).heloGot}:hNeed(mis.to,t);const it=ld.items.find(i=>i.t===t);const on=(mis.tasks||[]).includes(t);

function clampView(v){let [x,y,w,h]=v;w=Math.min(MAP_VIEW[2],Math.max(160,w));h=w*MAP_VIEW[3]/MAP_VIEW[2];
  x=Math.min(MAP_VIEW[0]+MAP_VIEW[2]-w,Math.max(MAP_VIEW[0],x));y=Math.min(MAP_VIEW[1]+MAP_VIEW[3]-h,Math.max(MAP_VIEW[1],y));return [x,y,w,h]}
function bindZoom(){
  const svg=$('#mapsvg');if(!svg)return;const cur0=()=>UI.view||MAP_VIEW;

  const center=()=>{const v=cur();return [v[0]+v[2]/2,v[1]+v[3]/2]};
  $('#zin').onclick=()=>zoomAt(1/1.4,...center());$('#zout').onclick=()=>zoomAt(1.4,...center());$('#zreset').onclick=()=>setV(MAP_VIEW.slice());
  svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1/1.2:1.2,...toMap(e.clientX,e.clientY))},{passive:false});
  const pts=new Map();let start=null,moved=false;
  svg.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
    if(pts.size===1)start={x:e.clientX,y:e.clientY,v:cur()};
    else if(pts.size===2){const [a,b]=[...pts.values()];start={pinch:Math.hypot(a.x-b.x,a.y-b.y),mid:toMap((a.x+b.x)/2,(a.y+b.y)/2),v:cur()}}});

    if(pts.size===1&&start.v&&start.pinch==null){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;if(!moved)return;
      svg.setPointerCapture(e.pointerId);const v=start.v;setV([v[0]-dx/r.width*v[2],v[1]-dy/r.height*v[3],v[2],v[3]])}
    else if(pts.size===2&&start.pinch){moved=true;const [a,b]=[...pts.values()];const f=start.pinch/Math.max(10,Math.hypot(a.x-b.x,a.y-b.y));const v=start.v,[mx,my]=start.mid;

  const end=e=>{pts.delete(e.pointerId);if(pts.size===0)start=null;else if(pts.size===1){const [a]=[...pts.values()];start={x:a.x,y:a.y,v:cur()}}};

}

      if(canLook&&!done)h+=`<div class="row small">${hs.length>1?`<select data-lookhex="${s.id}" aria-label="Hex to look at">${hs.map(x=>{const t=(G.pla[x]||[]).filter(t=>t.id>0);return `<option value="${x}" ${s.focus===x?'selected':''}>Hex ${hexLabel(x)}${t.length?' · '+t.map(t=>t.id===2?TOKEN_TAG(t):'?').join('/'):''}</option>`}).join('')}</select>`:hs.length?`<span>Hex ${hexLabel(hs[0])}</span>`:'<span class="muted">Not over theater: orbit scan only.</span>'}<button class="btn sm" data-look="${s.id}">Look</button></div>`;
      else if(canLook&&done)h+='<div class="small muted">Looked this turn.</div>';
      if(s.type==='GPS'&&hs.length)h+=hs.length>1?`<div class="row small"><span>GPS +1 hex:</span><select data-focus="${s.id}" aria-label="GPS hex">${hs.map(x=>`<option value="${x}" ${s.focus===x?'selected':''}>Hex ${hexLabel(x)}</option>`).join('')}</select></div>`:`<div class="small">GPS +1 over hex ${hexLabel(hs[0])} this turn.</div>`;
      if(s.type==='OW'){const tg=phase()==='conflict'&&!done?S.prc.filter(p=>p.alive&&p.known&&p.kind!=='civ'&&p.orbit===s.orbit&&circDist(s.orbit,p.pos,s.pos)<=1):[];
        const sj=phase()==='conflict'&&!done?hs.filter(x=>(G.pla[x]||[]).some(t=>t.s==='sj'&&t.id===2)):[];
        h+=`<div class="row small">${tg.map(p=>`<button class="btn sm" data-owsat="${s.id}|${p.id}">Attack ${esc(PRC_KIND[p.kind])} at ${posName(p.orbit,p.pos)}</button>`).join('')}${sj.map(x=>`<button class="btn sm" data-owsj="${s.id}|${x}">Attack satellite jammer in hex ${hexLabel(x)}</button>`).join('')}${!tg.length&&!sj.length?`<span class="muted">${phase()==='crisis'?'Attacks open in the conflict phase.':done?'Acted this turn.':'No identified PRC target in reach.'}</span>`:''}</div>`}
      if(s.fuel&&s.orbit!=='G')h+=`<div class="row small"><span>Fuel chit at next move:</span><select data-fuel="${s.id}" aria-label="Fuel chit use"><option value="">Keep it</option><option value="hold" ${s.fuelAct==='hold'?'selected':''}>Hold position</option><option value="extra" ${s.fuelAct==='extra'?'selected':''}>Advance an extra position</option><option value="back" ${s.fuelAct==='back'?'selected':''}>Fall back one position</option></select></div>`;
    }
    h+=`<div class="small muted">${esc(SAT_TYPES[s.type].what)}</div></div>`});
  const known=S.prc.filter(p=>p.alive&&p.known);
  h+=`<h3>Other objects</h3><p class="small">${S.prc.filter(p=>p.alive&&!p.known).length} unknown object(s) on the board. Identified: ${known.length?known.map(p=>`${PRC_KIND[p.kind]} at ${posName(p.orbit,p.pos)}`).join(' · '):'none yet'}.</p>`;
  return h+'</div>';
}
function bindSpace(){
  const S=G.space;if(!S)return;
  document.querySelectorAll('[data-place]').forEach(sel=>sel.onchange=()=>{const s=S.sats.find(x=>x.id==sel.dataset.place);const [o,p]=sel.value.split('|');if(!occupied(o,+p,s)){s.orbit=o;s.pos=+p}save();render()});
  document.querySelectorAll('[data-lookhex]').forEach(sel=>sel.onchange=()=>{S.sats.find(x=>x.id==sel.dataset.lookhex).focus=+sel.value;save()});
  document.querySelectorAll('[data-focus]').forEach(sel=>sel.onchange=()=>{S.sats.find(x=>x.id==sel.dataset.focus).focus=+sel.value;save();render()});
  document.querySelectorAll('[data-look]').forEach(b=>b.onclick=()=>{const s=S.sats.find(x=>x.id==b.dataset.look);const hs=lookHexes(s);const sel=document.querySelector(`[data-lookhex="${s.id}"]`);
    const hex=hs.length>1?+(sel?sel.value:hs[0]):hs.length?hs[0]:null;spaceLook(s,hex);save();render()});
  document.querySelectorAll('[data-fuel]').forEach(sel=>sel.onchange=()=>{S.sats.find(x=>x.id==sel.dataset.fuel).fuelAct=sel.value;save()});
  document.querySelectorAll('[data-owsat]').forEach(b=>b.onclick=()=>{const [a,t]=b.dataset.owsat.split('|');const s=S.sats.find(x=>x.id==a),p=S.prc.find(x=>x.id==t);
    owRoll(s,PRC_KIND[p.kind],p.kind==='dual',()=>{p.alive=false});save();render()});
  document.querySelectorAll('[data-owsj]').forEach(b=>b.onclick=()=>{const [a,hex]=b.dataset.owsj.split('|');const s=S.sats.find(x=>x.id==a);
    owRoll(s,`satellite jammer in hex ${hexLabel(+hex)}`,false,()=>{G.pla[hex]=G.pla[hex].filter(t=>t.s!=='sj')});save();render()});
  const cg=$('#cybergo');if(cg)cg.onclick=()=>{S.cyberHex=+$('#cyberhex').value;log('acc',`Offensive cyber package queued against hex ${hexLabel(S.cyberHex)} for this turn.`);save();render()};
  const cx=$('#cyberx');if(cx)cx.onclick=()=>{S.cyberHex=null;save();render()};
  const lt=$('#lntype');if(lt)lt.onchange=()=>{UI.ln={type:lt.value,pos:''};render()};
  const lp=$('#lnpos');if(lp)lp.onchange=()=>{UI.ln.pos=lp.value};
  const lg=$('#lngo');if(lg)lg.onclick=()=>{if(S.launch<=0)return;
    if(UI.ln.type==='CYBER'){S.cyber++;S.launchCyber=true;S.launch--;log('ok','CSpOC adds an offensive cyber package.');UI.ln={type:'ISR',pos:''};save();render();return}
    const v=($('#lnpos')||{}).value;if(!v)return;const [o,p]=v.split('|');if(occupied(o,+p))return;
    const s=addSat(UI.ln.type,o,+p);S.launch--;log('ok',`${s.code} launched to ${posName(o,+p)}. It can look after it moves next turn.`);UI.ln={type:UI.ln.type,pos:''};save();render()};
}

/* =================== BINDINGS =================== */
function bindStart(){
  document.querySelectorAll('[data-mob]').forEach(b=>b.onclick=()=>{UI.startMob=b.dataset.mob;render()});
  document.querySelectorAll('[data-len]').forEach(b=>b.onclick=()=>{UI.startLen=b.dataset.len;render()});
  document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{UI.startRole=b.dataset.role;render()});
  $('#start').onclick=()=>{if(UI.startRole==='mob'){newGame(UI.startMob,UI.startLen);UI.tab='fos'}else{newTheaterGame(UI.startRole,UI.startLen);UI.tab=UI.startRole==='caoc'?'thr':UI.startRole==='medcom'?'hosp':'space'}UI.showHelp=true;render()};
  const r=$('#resume');if(r)r.onclick=()=>{G=store.get('ops-campaign-v2');render()};
}
function bind(){
  $('#exec').onclick=()=>{executeTurn();render()};
  $('#help').onclick=()=>{UI.showHelp=true;render()};
  $('#restart').onclick=()=>{UI.confirmRestart?(store.del('ops-campaign-v2'),G=null,UI={tab:'fos',rfiPick:{}},render()):(UI.confirmRestart=true,$('#restart').textContent='Click again to confirm')};
  const ch=$('#closehelp');if(ch)ch.onclick=()=>{UI.showHelp=false;render()};
  const sl=$('#seelog');if(sl)sl.onclick=()=>{UI.ackOver=true;render()};
  const ag=$('#again');if(ag)ag.onclick=()=>{store.del('ops-campaign-v2');G=null;UI={tab:'fos',rfiPick:{}};render()};
  bindSpace();bindZoom();
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{UI.tab=b.dataset.tab;render()});
  document.querySelectorAll('.hexhit').forEach(p=>p.onclick=()=>{
    const hex=+p.dataset.hex;const here=Object.keys(FOS_HEX).map(Number).filter(n=>FOS_HEX[n]===hex);
    const mine=here.find(n=>fosByNum(n));UI.tab='fos';
    if(mine){UI.selFos=mine;render();return}
    if(!here.length){render();return}
    UI.hexPick=here;render();const sel=$('#addfos');if(sel){sel.value=String(here[0]);sel.focus()}});
  const ab=$('#addfosbtn');if(ab)ab.onclick=()=>{const v=+$('#addfos').value;if(!v||G.fos.length>=4)return;const f=newFos(v);const K=(G.known||{})[v];
    if(K){f.rfi={...K.rfi};f.asked=K.asked;f.assessed=!!K.assessed;applyRfiSide(f)}G.fos.push(f);UI.selFos=v;log('acc',`FOS ${v} (${fosCountry(v)}, hex ${FOS_HEX[v]}) selected.${K?` Its earlier RFI answers still stand (${K.asked}/5 free RFIs used).`:' Pick 5 RFIs.'}`);save();render()};
  const svb=$('#svbox');if(svb)svb.ontoggle=()=>{UI.svOpen=svb.open};
  const svf=$('#svfos');if(svf)svf.onchange=()=>{UI.svFos=+svf.value;UI.svPick=[];render()};
  document.querySelectorAll('[data-svrfi]').forEach(b=>b.onclick=()=>{if(b.getAttribute('aria-disabled'))return;const v=+$('#svfos').value;const K=(G.known=G.known||{})[v]||{rfi:{},asked:0};const set=UI.svPick=(UI.svPick||[]).filter(k=>K.rfi[k]==null);
    const k=b.dataset.svrfi,i=set.indexOf(k);if(i>=0)set.splice(i,1);else if(set.length<5-K.asked)set.push(k);UI.svFos=v;render()});
  const sva=$('#svask');if(sva)sva.onclick=()=>{const v=+$('#svfos').value,dn=+$('#svdown').value;G.known=G.known||{};const K=G.known[v]=G.known[v]||{rfi:{},asked:0};const set=(UI.svPick||[]).filter(k=>K.rfi[k]==null).slice(0,5-K.asked);if(!set.length)return;
    set.forEach(k=>K.rfi[k]=d(3));K.asked+=set.length;G.standDown={n:dn,s:v,t:G.turn};UI.svPick=[];G.aircraft.forEach(a=>{if(a.plan&&String(a.plan.dest)===String(dn))a.plan=null});UI.sorties=(UI.sorties||[]).filter(s=>s.fos!==dn);
    log('acc',`Survey of FOS ${v}: ${set.map(k=>`${k} ${K.rfi[k]}`).join(', ')}. FOS ${dn} stands down this turn.`);save();render()};
  const rpp=$('#rppick');if(rpp)rpp.onchange=()=>{G.rpPick=rpp.value||null;save();render()};
  bindCJ();
  document.querySelectorAll('[data-escort]').forEach(b=>b.onclick=()=>{const [n,x]=b.dataset.escort.split('|').map(Number);const f=fosByNum(n);const used=UI.sorties.filter(s=>s.fos===n).reduce((k,s)=>k+s.n,0);if(f.fighters-used<1){b.textContent='No free fighter';return}UI.sorties.push({fos:n,hex:x,n:1,escort:true});render()});
  document.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>{const n=+b.dataset.drop;const f=fosByNum(n);
    if(f.pax>0&&!UI['drop'+n]){UI['drop'+n]=true;b.textContent='Lose everything there? Click again';return}
    const trapped=!canLand(fosCountry(n));
    if(!trapped&&G.aircraft.some(a=>a.loc.k==='fos'&&a.loc.n===n)){b.textContent='Fly aircraft out first';return}
    G.known=G.known||{};G.known[n]={rfi:{...f.rfi},asked:f.asked,assessed:f.assessed};
    if(trapped){const lost=G.aircraft.filter(a=>a.loc.k==='fos'&&a.loc.n===n);G.aircraft=G.aircraft.filter(a=>!lost.includes(a));log('bad',`FOS ${n} abandoned after ${fosCountry(n)} withdrew landing rights. ${f.fighters} fighter${f.fighters===1?'':'s'}${lost.length?`, ${lost.map(a=>a.cs).join(', ')}`:''} and everyone there stay trapped.`)}
    else{G.fightersMob+=f.fighters;log('acc',`FOS ${n} abandoned.${f.fighters?` ${f.fighters} fighters return to the MOB.`:''} Its RFI answers stay with the airfield.`)}
    G.fos=G.fos.filter(x=>x.num!==n);save();render()});
  document.querySelectorAll('[data-rfi]').forEach(b=>{const [n,k]=b.dataset.rfi.split('|');const card=$('#fos-'+n),hl=on=>{
      card.querySelectorAll('[data-task]').forEach(el=>el.classList.toggle('hl',on&&RFI_TASKS[k].includes(+el.dataset.task)));
      const hp=$('#rfih-'+n);if(hp)hp.textContent=on?b.dataset.help+(k==='Ramp'?' Task 15 Base Recovery can build a level-1 ramp up to level 2.':'')+(k==='Mobility'?' The Bed Down kit also brings a forklift.':''):'Hover or focus an RFI to light up the tasks it affects.'};
    b.onmouseenter=()=>hl(true);b.onmouseleave=()=>hl(false);b.onfocus=()=>hl(true);b.onblur=()=>hl(false);});
  document.querySelectorAll('[data-rfi]').forEach(b=>b.onclick=()=>{if(b.getAttribute('aria-disabled'))return;const [n,k]=b.dataset.rfi.split('|');const f=fosByNum(+n);const set=UI.rfiPick[n]=UI.rfiPick[n]||[];
    const i=set.indexOf(k);if(i>=0)set.splice(i,1);else if(set.length<5-f.asked)set.push(k);render()});
  document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{const n=+b.dataset.ask;const f=fosByNum(n);const set=UI.rfiPick[n]||[];
    set.forEach(k=>{f.rfi[k]=d(3)});f.asked+=set.length;log('acc',`FOS ${n} RFIs: ${set.map(k=>`${k} ${f.rfi[k]}`).join(', ')}.`);UI.rfiPick[n]=[];applyRfiSide(f);completeAssess(f);save();render()});
  document.querySelectorAll('[data-contract]').forEach(b=>b.onclick=()=>{const [n,t]=b.dataset.contract.split('|').map(Number);fosByNum(n).contractQ=t;save();render()});
  document.querySelectorAll('details[data-req]').forEach(d=>d.ontoggle=()=>{UI.reqOpen=UI.reqOpen||{};UI.reqOpen[d.dataset.req]=d.open});
  document.querySelectorAll('[data-dest]').forEach(s=>s.onchange=()=>{const a=G.aircraft.find(x=>x.id==s.dataset.dest);a.plan=s.value?{dest:s.value,intent:'land',load:[]}:null;if(a.plan&&s.value!=='mob'){const f=fosByNum(+s.value);if(f){const r=fosRoom(a,f);if(f.runway>=3&&a.type!=='C-5'&&a.loc.k==='mob')a.plan.intent='airdrop';else if(!r.land&&r.ret)a.plan.intent='return'}}save();render()});
  document.querySelectorAll('[data-intent]').forEach(s=>s.onchange=()=>{const a=G.aircraft.find(x=>x.id==s.dataset.intent);a.plan.intent=s.value;delete a.plan.hold;if(s.value!=='land'){delete a.plan.via;a.plan.load=a.plan.load.filter(it=>it.fos===+a.plan.dest)}save();render()});
  document.querySelectorAll('[data-hold]').forEach(s=>s.onchange=()=>{const a=G.aircraft.find(x=>x.id==s.dataset.hold);if(s.value==='')delete a.plan.hold;else a.plan.hold=+s.value;save();render()});
  document.querySelectorAll('[data-via]').forEach(s=>s.onchange=()=>{const a=G.aircraft.find(x=>x.id==s.dataset.via);if(s.value)a.plan.via=s.value;else delete a.plan.via;a.plan.load=a.plan.load.filter(it=>it.fos===+a.plan.dest||(a.plan.via&&it.fos===+a.plan.via));save();render()});
  document.querySelectorAll('[data-load]').forEach(cb=>cb.onchange=()=>{const [id,k,t,pt,fn]=cb.dataset.load.split('|');const a=G.aircraft.find(x=>x.id==id);const fos=+fn||+a.plan.dest;const it=k==='kit'?{k,t:+t,p:pt,fos}:{k,x:t,fos};
    if(cb.checked)a.plan.load.push(it);else a.plan.load=a.plan.load.filter(x=>!(x.k===it.k&&x.t===it.t&&x.x===it.x&&x.p===it.p&&x.fos===fos));save();render()});
  document.querySelectorAll('[data-stock]').forEach(inp=>inp.onchange=()=>{const [id,s,fn]=inp.dataset.stock.split('|');const a=G.aircraft.find(x=>x.id==id);const fos=+fn||+a.plan.dest;
    const used=G.aircraft.reduce((n,b)=>n+(b.plan?.load||[]).filter(x=>x.k==='stock'&&x.s===s&&!(b===a&&x.fos===fos)).reduce((m,x)=>m+x.n,0),0);
    const n=Math.max(0,Math.min(G.stock[s]-used,parseInt(inp.value)||0));a.plan.load=a.plan.load.filter(x=>!(x.k==='stock'&&x.s===s&&x.fos===fos));if(n)a.plan.load.push({k:'stock',s,n,fos});save();render()});
  document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const n=+b.dataset.move;const v=Math.max(1,parseInt($('#mv-'+n).value)||1);const max=+$('#mv-'+n).max;if(max<1)return;UI.pendingMoves.push({to:n,n:Math.min(v,max)});render()});
  document.querySelectorAll('[data-unmove]').forEach(b=>b.onclick=()=>{UI.pendingMoves.splice(+b.dataset.unmove,1);render()});
  document.querySelectorAll('[data-sortie]').forEach(b=>b.onclick=()=>{const n=+b.dataset.sortie;const f=fosByNum(n);const planned=UI.sorties.filter(s=>s.fos===n).reduce((x,s)=>x+s.n,0);
    const k=Math.min(2,f.fighters-planned,parseInt($('#sn-'+n).value)||1);if(k<1){b.textContent='No free fighters';return}const hex=+$('#sx-'+n).value,lv=$('#sl-'+n)?$('#sl-'+n).value:String(n);const land=lv==='mob'?'mob':+lv;
    if(land!==n){const lh=land==='mob'?MOBS[G.mob].hex:FOS_HEX[land];if(hexDist(hex,lh)>4){b.textContent=`Too far: ${land==='mob'?'the MOB':'FOS '+land} is ${hexDist(hex,lh)} hexes from the target (max 4)`;return}
      if(land!=='mob'){const L=fosByNum(land);const inbound=UI.sorties.filter(x=>x.land===land&&x.fos!==land).reduce((q,x)=>q+x.n,0);if(landRoom(L)-inbound<k){b.textContent=`No fighter parking left at FOS ${land}`;return}}}
    UI.sorties.push({fos:n,hex,n:k,land});render()});
  document.querySelectorAll('[data-unsortie]').forEach(b=>b.onclick=()=>{UI.sorties=UI.sorties.filter(s=>s.fos!==+b.dataset.unsortie);render()});
  document.querySelectorAll('[data-tc]').forEach(inp=>inp.onchange=()=>{UI.tc[inp.dataset.tc]=Math.max(0,parseInt(inp.value)||0);render()});
  const tcs=$('#tcsend');if(tcs)tcs.onclick=()=>{const items=Object.entries(UI.tc).filter(([k,v])=>v>0).map(([k,v])=>{const [kind,id]=k.split('|');return kind==='kit'?{k:'kit',t:+id,n:v}:kind==='extra'?{k:'extra',x:id,n:v}:{k:'stock',s:id,n:v}});
    G.transcom.push({arrive:G.turn+2,items});G.tcNext=G.turn+2;UI.tc={};log('acc',`USTRANSCOM request sent. Two C-5s land at the MOB on turn ${G.turn+2}.`);save();render()};
}
if(typeof document!=='undefined')render();
